<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .85; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width:390px;height:1230px;position:relative;background:#FAF7F2;font-family:'Noto Sans TC',sans-serif;color:#1B1815;overflow:hidden;">

  <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E7DFD2;">
    <a href="MainCard2.dc.html" aria-label="返回" style="width:34px;height:34px;flex-shrink:0;border-radius:50%;border:1px solid #E7DFD2;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#1B1815;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin:0;flex:1;text-align:center;font-family:'Noto Serif TC',serif;font-weight:500;font-size:16px;line-height:24px;letter-spacing:.15px;">建立旅程</h1>
    <span style="width:34px;height:34px;flex-shrink:0;" aria-hidden="true"></span>
  </div>

  <div style="padding:18px 16px 0;">
    
    <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">卡片預覽</label>
    <div style="display:flex;gap:12px;align-items:flex-start;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;padding:12px;box-shadow:0 3px 10px rgba(27,24,21,.06);">
      <div style="flex-shrink:0;width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#EAF5F1,#CFE8DC);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#1B5847" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
          <h3 style="margin:0;font-family:'Noto Serif TC',serif;font-weight:600;font-size:16px;color:#B7AE9D;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">峇里島放鬆之旅</h3>
          <span style="flex-shrink:0;background:#E7DFD2;color:#6E6860;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;">— 天</span>
        </div>
        <p style="margin:2px 0 8px;font-size:12px;color:#B7AE9D;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">尚未設定日期 · 尚未邀請旅伴</p>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="width:20px;height:20px;border-radius:50%;background:#D2EAE1;color:#1B5847;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;">我</div>
          <p style="margin:0;font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;color:#B7AE9D;">尚未記帳</p>
        </div>
      </div>
    </div>
  </div>

  <div style="padding:20px 16px 0;">
    <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">封面圖示</label>
    <div style="display:flex;justify-content:space-between;">
      <span style="width:40px;height:40px;border-radius:50%;background:#EAF5F1;border:1.5px solid #2F8F74;color:#1B5847;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E7DFD2;color:#6E6860;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c8 0 14-6 14-14-8 0-14 6-14 14z"></path><path d="M5 19c3-3 5-6 6-9"></path></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E7DFD2;color:#6E6860;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 002 2 2 2 0 002-2V3M9 12v9M17 3c-1.5 0-2.5 2-2.5 5s1 5 2.5 5v6"></path></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E7DFD2;color:#6E6860;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.5 3.8 6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-6-3.8-9s1.3-6.5 3.8-9z"></path></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E7DFD2;color:#6E6860;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V12l2-5h12l2 5v4"></path><path d="M4 16h16M7 16v2M17 16v2"></path><circle cx="7.5" cy="16" r="1.3"></circle><circle cx="16.5" cy="16" r="1.3"></circle></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E7DFD2;color:#6E6860;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19v-6a2 2 0 012-2h14a2 2 0 012 2v6M3 19h18M5 11V7a1 1 0 011-1h4a1 1 0 011 1v4M13 11V9a1 1 0 011-1h4a1 1 0 011 1v2"></path></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E7DFD2;color:#6E6860;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.3 1.1 6.1L12 16.9 6.7 19.7l1.1-6.1L3.3 9.3l6.1-.7z"></path></svg>
      </span>
    </div>
  </div>

  <div style="padding:20px 16px 0;">
    <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">封面顏色</label>
    <div style="display:flex;justify-content:space-between;">
      <span style="width:40px;height:40px;border-radius:12px;background:#1B5847;box-shadow:0 0 0 2px #FAF7F2, 0 0 0 3.5px #1B5847;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg>
      </span>
      <span style="width:40px;height:40px;border-radius:12px;background:#C4602F;"></span>
      <span style="width:40px;height:40px;border-radius:12px;background:#6B5B95;"></span>
      <span style="width:40px;height:40px;border-radius:12px;background:#9C7A28;"></span>
      <span style="width:40px;height:40px;border-radius:12px;background:#A14A68;"></span>
      <span style="width:40px;height:40px;border-radius:12px;background:#2A241F;"></span>
    </div>
  </div>

  <div style="padding:14px 16px 0;">
    <button type="button" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;box-sizing:border-box;border:1.5px dashed #C9BFAC;border-radius:12px;padding:11px;font-size:12px;font-weight:600;color:#6E6860;background:#FFFFFF;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 16l5-5 4 4 3-3 6 6"></path><circle cx="8" cy="9.5" r="1.5"></circle></svg>
      或上傳自訂圖片
    </button>
  </div>

  <div style="padding:20px 16px 0;">
    <label for="tname" style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">旅程名稱 <span style="color:#C4472F;">*</span></label>
    <input id="tname" placeholder="例如：日本關西 5 天、歐洲自由行" style="width:100%;box-sizing:border-box;border:1px solid #E7DFD2;border-radius:12px;padding:13px 14px;font-size:16px;line-height:24px;letter-spacing:.5px;font-weight:700;background:#FFFFFF;color:#1B1815;">
  </div>

  <div style="padding:16px 16px 0;">
    <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">出發日與結束日</label>
    <div style="display:flex;align-items:center;gap:8px;padding:13px 14px;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:12px;color:#B7AE9D;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg>
      <span style="font-size:12px;">選擇日期</span>
    </div>
  </div>

  <div style="padding:16px 16px 0;display:flex;gap:10px;">
    <div style="flex:1;">
      <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">結算幣別</label>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 14px;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:12px;">
        <span style="font-size:12px;font-weight:700;line-height:16px;letter-spacing:.5px;">TWD 台幣</span>
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#B7AE9D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="flex:1;">
      <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">預算（選填）</label>
      <div style="display:flex;align-items:center;gap:6px;padding:13px 14px;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:12px;">
        <span style="font-size:12px;color:#B7AE9D;">NT$</span>
        <span style="font-size:12px;color:#B7AE9D;">10,000</span>
      </div>
    </div>
  </div>

  <div style="padding:16px 16px 0;">
    <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:8px;">描述（選填）</label>
    <div style="width:100%;box-sizing:border-box;border:1px solid #E7DFD2;border-radius:12px;padding:13px 14px;font-size:12px;color:#B7AE9D;background:#FFFFFF;min-height:72px;">記錄這次旅行的目的地、日期等資訊……</div>
  </div>

  <div style="padding:20px 16px 0;">
    <label style="display:block;font-size:12px;color:#6E6860;font-weight:600;margin-bottom:2px;">成員加入方式</label>
    <p style="margin:0 0 10px;font-size:12px;color:#B7AE9D;">設定新成員透過分享連結加入時的方式</p>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1.5px solid #2F8F74;background:#EAF5F1;">
        <span style="width:16px;height:16px;border-radius:50%;border:5px solid #2F8F74;flex-shrink:0;margin-top:1px;"></span>
        <div>
          <p style="margin:0;font-size:14px;font-weight:700;line-height:20px;letter-spacing:.1px;">兩者皆可</p>
          <p style="margin:2px 0 0;font-size:12px;color:#6E6860;">新成員可選擇建立新身份或取代佔位成員</p>
        </div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid #E7DFD2;background:#FFFFFF;">
        <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid #C9BFAC;flex-shrink:0;margin-top:1px;"></span>
        <div>
          <p style="margin:0;font-size:14px;font-weight:700;line-height:20px;letter-spacing:.1px;">僅建立新成員</p>
          <p style="margin:2px 0 0;font-size:12px;color:#6E6860;">新成員只能建立自己的身份</p>
        </div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid #E7DFD2;background:#FFFFFF;">
        <span style="width:16px;height:16px;border-radius:50%;border:1.5px solid #C9BFAC;flex-shrink:0;margin-top:1px;"></span>
        <div>
          <p style="margin:0;font-size:14px;font-weight:700;line-height:20px;letter-spacing:.1px;">僅取代佔位成員</p>
          <p style="margin:2px 0 0;font-size:12px;color:#6E6860;">新成員只能取代現有的佔位成員</p>
        </div>
      </div>
    </div>
  </div>

  <div style="height:100px;"></div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:#FFFFFF;border-top:1px solid #E7DFD2;">
    <a href="Trip.dc.html" style="display:block;text-align:center;padding:15px;border-radius:14px;background:#1B5847;color:#FFFFFF;font-size:16px;line-height:24px;letter-spacing:.15px;font-weight:700;">建立旅程</a>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1230}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
