<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: .85; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width:390px;height:1500px;position:relative;background:#FAF7F2;font-family:'Noto Sans TC',sans-serif;color:#1B1815;overflow:hidden;">

  <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E7DFD2;">
    <a href="Trip.dc.html" aria-label="關閉" style="width:32px;height:32px;border-radius:50%;background:#F1EBE0;display:flex;align-items:center;justify-content:center;color:#1B1815;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <h1 style="margin:0;display:flex;align-items:center;gap:6px;font-family:'Noto Serif TC',serif;font-weight:600;font-size:17px;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#E8825A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.5L18 9l-4.1 1.5L12 15l-1.9-4.5L6 9l4.1-1.5z"></path></svg>
      AI 快速記帳
    </h1>
    <span style="width:32px;height:32px;"></span>
  </div>

  <div style="margin:20px 16px 0;display:flex;align-items:center;justify-content:space-between;">
    <span style="font-size:13px;font-weight:700;">支出明細</span>
    <span style="font-size:12px;color:#6E6860;">2 / 3</span>
  </div>

  <div style="margin:8px 16px 0;display:flex;align-items:center;justify-content:center;gap:6px;">
    <span style="width:8px;height:8px;border-radius:99px;background:#E7DFD2;"></span>
    <span style="width:24px;height:8px;border-radius:99px;background:#1B5847;"></span>
    <span style="width:8px;height:8px;border-radius:99px;background:#E7DFD2;"></span>
  </div>

  <div style="margin:12px 16px 0;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:20px;padding:16px;">

    <div style="display:flex;justify-content:flex-end;">
      <button aria-label="刪除這一筆" style="width:28px;height:28px;border-radius:50%;background:#FBEAE0;color:#C4472F;border:none;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
      </button>
    </div>

    <div style="margin-top:4px;background:linear-gradient(135deg,#EAF5F1,#FAF7F2);border-radius:16px;padding:14px 16px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <button style="display:inline-flex;align-items:center;gap:4px;flex-shrink:0;background:#FFFFFF;color:#1B1815;border:none;border-radius:12px;padding:9px 11px;font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(27,24,21,.06);">
          TWD
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="#B7AE9D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <input value="60" style="flex:1;min-width:0;font-family:'Noto Serif TC',serif;font-weight:700;font-size:32px;border:none;background:none;color:#1B1815;outline:none;">
      </div>
    </div>

    <div style="margin-top:14px;">
      <label style="display:block;font-size:12px;color:#6E6860;margin-bottom:6px;font-weight:600;">描述</label>
      <input value="午餐" style="width:100%;box-sizing:border-box;border:1px solid #E7DFD2;border-radius:12px;padding:10px 12px;font-size:13px;background:#FFFFFF;color:#1B1815;">
    </div>

    <div style="margin-top:14px;">
      <p style="margin:0 0 8px;font-size:12px;color:#6E6860;font-weight:600;">類別</p>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
        <button style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;border:1.5px solid #2F8F74;background:#EAF5F1;color:#1B5847;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 002 2 2 2 0 002-2V3M9 12v9M17 3c-1.5 0-2.5 2-2.5 5s1 5 2.5 5v6"></path></svg>
          <span style="font-size:12px;font-weight:700;">餐飲</span>
        </button>
        <button style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;border:1.5px solid #E7DFD2;background:#E7F3EE;color:#2F8F74;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V12l2-5h12l2 5v4"></path><path d="M4 16h16M7 16v2M17 16v2"></path><circle cx="7.5" cy="16" r="1.3"></circle><circle cx="16.5" cy="16" r="1.3"></circle></svg>
          <span style="font-size:12px;font-weight:600;">交通</span>
        </button>
        <button style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;border:1.5px solid #E7DFD2;background:#EFEAF7;color:#6B5B95;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19v-6a2 2 0 012-2h14a2 2 0 012 2v6M3 19h18M5 11V7a1 1 0 011-1h4a1 1 0 011 1v4M13 11V9a1 1 0 011-1h4a1 1 0 011 1v2"></path></svg>
          <span style="font-size:12px;font-weight:600;">住宿</span>
        </button>
        <button style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;border:1.5px solid #E7DFD2;background:#F1EBE0;color:#6E6860;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="8" cy="8" r="1.5"></circle><circle cx="16" cy="8" r="1.5"></circle><circle cx="8" cy="16" r="1.5"></circle><circle cx="16" cy="16" r="1.5"></circle></svg>
          <span style="font-size:12px;font-weight:600;">其他</span>
        </button>
      </div>
    </div>

    <div style="margin-top:14px;">
      <p style="margin:0 0 8px;font-size:12px;color:#6E6860;font-weight:600;">誰付的錢？</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        <button style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 5px;border-radius:99px;background:#1B5847;color:#FFFFFF;border:none;">
          <span style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">我</span>
          <span style="font-size:12px;font-weight:700;">我</span>
        </button>
        <button style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 5px;border-radius:99px;background:#FFFFFF;color:#1B1815;border:1px solid #E7DFD2;">
          <span style="width:18px;height:18px;border-radius:50%;background:#FBE3D2;color:#C4602F;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">志</span>
          <span style="font-size:12px;font-weight:600;">志明</span>
        </button>
        <button style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 5px;border-radius:99px;background:#FFFFFF;color:#1B1815;border:1px solid #E7DFD2;">
          <span style="width:18px;height:18px;border-radius:50%;background:#EFEAF7;color:#6B5B95;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">凱</span>
          <span style="font-size:12px;font-weight:600;">阿凱</span>
        </button>
      </div>
    </div>

    <div style="margin-top:14px;">
      <p style="margin:0 0 8px;font-size:12px;color:#6E6860;font-weight:600;">幫誰付？（3 人均分 · 每人 NT$20）</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">
        <button style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 5px;border-radius:99px;background:#2F8F74;color:#FFFFFF;border:none;">
          <span style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">我</span>
          <span style="font-size:12px;font-weight:700;">我</span>
        </button>
        <button style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 5px;border-radius:99px;background:#2F8F74;color:#FFFFFF;border:none;">
          <span style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">志</span>
          <span style="font-size:12px;font-weight:700;">志明</span>
        </button>
        <button style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 5px;border-radius:99px;background:#2F8F74;color:#FFFFFF;border:none;">
          <span style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;">凱</span>
          <span style="font-size:12px;font-weight:700;">阿凱</span>
        </button>
      </div>
    </div>

    <div style="margin:14px 0 0;border-top:1px dashed #E7DFD2;"></div>

    <div style="margin-top:14px;">
      <p style="margin:0 0 8px;font-size:12px;color:#6E6860;font-weight:600;">支出日期</p>
      <button type="button" style="display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;border:1px solid #E7DFD2;border-radius:12px;padding:9px 12px;font-size:12px;background:#FFFFFF;color:#1B1815;text-align:left;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#6E6860" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <span>11/16（一）</span>
      </button>
    </div>

    <div style="margin-top:10px;">
      <p style="margin:0 0 8px;font-size:12px;color:#6E6860;font-weight:600;">消費地點</p>
      <button type="button" style="display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;border:1px solid #E7DFD2;border-radius:12px;padding:9px 12px;font-size:12px;background:#FFFFFF;color:#1B1815;text-align:left;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#E8825A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
        <span>點擊獲取位置</span>
      </button>
    </div>

    <div style="margin-top:10px;">
      <p style="margin:0 0 8px;font-size:12px;color:#6E6860;font-weight:600;">收據/消費圖片</p>
      <button type="button" style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;box-sizing:border-box;border:1.5px dashed #C9BFAC;border-radius:12px;padding:10px;color:#6E6860;background:#FFFFFF;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.4"></circle><path d="M21 15l-5-4-4 3-3-2-6 5"></path></svg>
        <span style="font-size:12px;font-weight:600;">新增照片</span>
      </button>
    </div>

  </div>

  <div style="margin:14px 16px 0;display:flex;align-items:center;justify-content:space-between;background:#EAF5F1;border-radius:14px;padding:12px 16px;">
    <span style="font-size:12px;color:#1B5847;font-weight:600;">共 3 筆</span>
    <span style="font-family:'Noto Serif TC',serif;font-weight:700;font-size:17px;color:#1B5847;">NT$210</span>
  </div>

  <div style="margin:10px 16px 0;display:flex;align-items:center;gap:10px;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:14px;padding:12px 14px;">
    <span style="width:20px;height:20px;border-radius:6px;background:#1B5847;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg>
    </span>
    <div>
      <p style="margin:0;font-size:12px;font-weight:700;">通知 LINE 群組</p>
      <p style="margin:1px 0 0;font-size:12px;color:#6E6860;">新增後自動發送通知到群組</p>
    </div>
  </div>

  <div style="margin:16px 16px 0;display:flex;gap:10px;">
    <button style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#FFFFFF;border:1.5px solid #E7DFD2;color:#1B1815;border-radius:14px;padding:13px;font-size:13px;font-weight:700;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 2.6 6.4"></path><path d="M3 21v-5h5"></path></svg>
      重新輸入
    </button>
    <button style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#1B5847;color:#FFFFFF;border:none;border-radius:14px;padding:13px;font-size:13px;font-weight:700;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4z"></path></svg>
      新增 3 筆
    </button>
  </div>

  <div style="height:24px;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
