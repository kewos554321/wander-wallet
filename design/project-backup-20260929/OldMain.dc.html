<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
</style>
</helmet>

<div style="width:390px;height:720px;position:relative;background:#FFFFFF;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#0F172A;overflow:hidden;">

  <div style="height:56px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #E2E8F0;">
    <span style="font-weight:700;font-size:17px;">所有專案</span>
  </div>

  <div style="margin:16px;height:56px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#94A3B8;font-size:11px;">廣告 Banner</div>

  <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px;">

    <div style="height:144px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(135deg,#7FC7AE,#3B8F76);">
      <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.7), rgba(0,0,0,.2) 55%, transparent);"></div>
      <div style="position:absolute;left:0;right:0;bottom:0;padding:14px;color:#FFFFFF;">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;">
          <div>
            <p style="margin:0;font-weight:700;font-size:17px;">東京賞楓 5 日</p>
            <p style="margin:2px 0 0;font-size:11px;color:rgba(255,255,255,.7);">11/12 - 11/16</p>
          </div>
          <div style="text-align:right;">
            <p style="margin:0;font-weight:700;font-size:19px;">NT$48,600</p>
            <p style="margin:0;font-size:10px;color:rgba(255,255,255,.7);">人均 NT$12,150</p>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.85);">
          <div style="display:flex;align-items:center;gap:6px;">
            <div style="display:flex;">
              <div style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5);"></div>
              <div style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5);margin-left:-5px;"></div>
              <div style="width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5);margin-left:-5px;"></div>
            </div>
            <span>4 人</span>
          </div>
          <span>12 筆支出</span>
        </div>
      </div>
    </div>

    <div style="position:relative;border-radius:12px;border:1px solid #E2E8F0;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:14px 14px 14px 18px;overflow:hidden;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,#7FC7AE,#3B8F76);"></div>
      <p style="margin:0;font-weight:600;font-size:15px;">大阪美食巡禮</p>
      <p style="margin:2px 0 0;font-size:11px;color:#94A3B8;">9/2 - 9/4</p>
      <div style="display:flex;align-items:baseline;gap:6px;margin-top:6px;">
        <span style="font-weight:700;font-size:19px;">NT$9,150</span>
        <span style="font-size:11px;color:#64748B;">/ 人均 NT$4,575</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #F1F5F9;font-size:11px;color:#64748B;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="display:flex;">
            <div style="width:18px;height:18px;border-radius:50%;background:#F1F5F9;border:1.5px solid #fff;box-shadow:0 0 0 1px #E2E8F0;"></div>
            <div style="width:18px;height:18px;border-radius:50%;background:#F1F5F9;border:1.5px solid #fff;box-shadow:0 0 0 1px #E2E8F0;margin-left:-5px;"></div>
          </div>
          <span>2 人</span>
        </div>
        <span>5 筆支出</span>
      </div>
    </div>

    <div style="position:relative;border-radius:12px;border:1px solid #E2E8F0;box-shadow:0 1px 2px rgba(15,23,42,.06);padding:14px 14px 14px 18px;overflow:hidden;">
      <div style="position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(to bottom,#7FC7AE,#3B8F76);"></div>
      <p style="margin:0;font-weight:600;font-size:15px;">清邁數位遊牧</p>
      <p style="margin:2px 0 0;font-size:11px;color:#94A3B8;">尚未設定日期</p>
      <div style="display:flex;align-items:baseline;gap:6px;margin-top:6px;">
        <span style="font-weight:700;font-size:19px;">NT$2,300</span>
        <span style="font-size:11px;color:#64748B;">/ 人均 NT$767</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #F1F5F9;font-size:11px;color:#64748B;">
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="display:flex;">
            <div style="width:18px;height:18px;border-radius:50%;background:#F1F5F9;border:1.5px solid #fff;box-shadow:0 0 0 1px #E2E8F0;"></div>
            <div style="width:18px;height:18px;border-radius:50%;background:#F1F5F9;border:1.5px solid #fff;box-shadow:0 0 0 1px #E2E8F0;margin-left:-5px;"></div>
            <div style="width:18px;height:18px;border-radius:50%;background:#F1F5F9;border:1.5px solid #fff;box-shadow:0 0 0 1px #E2E8F0;margin-left:-5px;"></div>
          </div>
          <span>3 人</span>
        </div>
        <span>2 筆支出</span>
      </div>
    </div>

  </div>

  <button style="margin:16px;width:calc(100% - 32px);padding:16px;border-radius:12px;border:1px dashed #E2E8F0;background:transparent;color:#94A3B8;font-size:13px;">+ 新增專案</button>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
