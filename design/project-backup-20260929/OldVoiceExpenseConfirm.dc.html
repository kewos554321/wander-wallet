<x-dc>

<div style="width:390px;height:1360px;position:relative;background:#F8FAFC;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#0F172A;overflow:hidden;">

  <div style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(15,23,42,.5);"></div>

  <div style="position:absolute;left:20px;right:20px;top:40px;background:#FFFFFF;border-radius:14px;box-shadow:0 20px 40px rgba(0,0,0,.2);padding:22px 20px;max-height:1280px;overflow-y:auto;">

    <div style="display:flex;align-items:center;gap:8px;">

    <div style="margin-top:16px;display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:600;">支出明細</span>
      <span style="font-size:13px;color:#94A3B8;">2 / 3</span>
    </div>

    <div style="margin-top:10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:14px;">

        </button>
      </div>

      <div style="margin-top:2px;display:flex;align-items:stretch;gap:8px;">
        <span style="display:flex;align-items:center;justify-content:center;padding:0 12px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;font-size:15px;font-weight:700;color:#3B8F76;">TWD</span>
        <div style="flex:1;display:flex;align-items:center;padding:0 12px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;font-size:22px;font-weight:700;">580</div>
      </div>

      <div style="margin-top:12px;">
        <p style="margin:0 0 4px;font-size:11px;color:#94A3B8;">描述</p>
        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:8px 10px;font-size:13px;">午餐</div>
      </div>

      <div style="margin-top:12px;">
        <p style="margin:0 0 6px;font-size:11px;color:#94A3B8;">類別</p>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;background:#3B8F76;color:#FFFFFF;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"></path><path d="M6 1v3M10 1v3M14 1v3"></path></svg>
            <span style="font-size:9px;">餐飲</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;background:#F1F5F9;color:#64748B;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2"></rect><circle cx="7.5" cy="17" r="1.5"></circle><circle cx="16.5" cy="17" r="1.5"></circle></svg>
            <span style="font-size:9px;">交通</span>

            <span style="font-size:9px;">住宿</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;background:#F1F5F9;color:#64748B;">

            <span style="font-size:9px;">票券</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;background:#F1F5F9;color:#64748B;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l1.5 6h9L18 2M3 6h18l-1.5 14a2 2 0 01-2 2H6.5a2 2 0 01-2-2L3 6z"></path></svg>

            <span style="font-size:9px;">娛樂</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;background:#F1F5F9;color:#64748B;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"></rect><path d="M12 8v13M3 12h18M12 8a2.5 2.5 0 01-2.5-2.5A2.5 2.5 0 0112 3a2.5 2.5 0 012.5 2.5A2.5 2.5 0 0112 8z"></path></svg>
            <span style="font-size:9px;">禮品</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;background:#F1F5F9;color:#64748B;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4l3 2"></path></svg>
            <span style="font-size:9px;">其他</span>

        </div>
      </div>

      <div style="margin-top:12px;">

        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#3B8F76;color:#FFFFFF;font-size:11px;font-weight:600;">我</span>

          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#F1F5F9;color:#475569;font-size:11px;font-weight:600;">志明</span>
          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#F1F5F9;color:#475569;font-size:11px;font-weight:600;">阿凱</span>
        </div>
      </div>

      <div style="margin-top:12px;">
        <p style="margin:0 0 6px;font-size:11px;color:#94A3B8;">幫誰付？（3人均分・每人 TWD 193）</p>
        <div style="display:flex;flex-wrap:wrap;gap:5px;">
          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#10B981;color:#FFFFFF;font-size:11px;font-weight:600;">我</span>
          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#10B981;color:#FFFFFF;font-size:11px;font-weight:600;">小美</span>
          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#10B981;color:#FFFFFF;font-size:11px;font-weight:600;">志明</span>
          <span style="display:flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#F1F5F9;color:#475569;font-size:11px;font-weight:600;">阿凱</span>
        </div>
      </div>

      <div style="margin:14px 0;border-top:1px solid #E2E8F0;"></div>

      <div style="margin-top:0;">
        <p style="margin:0 0 6px;font-size:11px;color:#94A3B8;">支出日期</p>
        <div style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:8px 10px;font-size:12px;">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
          <span>11/14（六）</span>
        </div>
      </div>

      <div style="margin-top:10px;">
        <p style="margin:0 0 6px;font-size:11px;color:#94A3B8;">消費地點</p>
        <div style="display:flex;align-items:center;gap:6px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;padding:8px 10px;font-size:12px;color:#94A3B8;">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>
          <span>點擊獲取位置</span>
        </div>
      </div>

      <div style="margin-top:10px;">
        <p style="margin:0 0 6px;font-size:11px;color:#94A3B8;">收據/消費圖片</p>
        <div style="display:flex;gap:6px;">
          <button type="button" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#FFFFFF;border:1.5px dashed #CBD5E1;border-radius:8px;padding:8px;font-size:11px;color:#94A3B8;">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 012-2h1.2a2 2 0 001.6-.8l.9-1.2a2 2 0 011.6-.8h1.4a2 2 0 011.6.8l.9 1.2a2 2 0 001.6.8H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"></path><circle cx="12" cy="13" r="3.3"></circle></svg>
            拍照

          <button type="button" style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:#FFFFFF;border:1.5px dashed #CBD5E1;border-radius:8px;padding:8px;font-size:11px;color:#94A3B8;">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.4"></circle><path d="M21 15l-5-4-4 3-3-2-6 5"></path></svg>
            上傳

        </div>
      </div>

    </div>

    <div style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:5px;">
      <span style="width:8px;height:8px;border-radius:99px;background:#CBD5E1;"></span>
      <span style="width:22px;height:8px;border-radius:99px;background:#3B8F76;"></span>
      <span style="width:8px;height:8px;border-radius:99px;background:#CBD5E1;"></span>
    </div>

    <div style="margin-top:10px;display:flex;align-items:center;justify-content:space-between;background:rgba(59,143,118,.07);border-radius:10px;padding:8px 12px;">
      <span style="font-size:12px;color:#64748B;">共 3 筆</span>
      <span style="font-size:15px;font-weight:700;color:#3B8F76;">TWD 1,280</span>
    </div>

    <label style="margin-top:8px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;">
      <span style="width:15px;height:15px;border-radius:4px;background:#3B8F76;flex-shrink:0;display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"></path></svg>
      </span>
      <span style="font-size:11.5px;">通知 LINE 群組</span>
    </label>

    <div style="margin-top:10px;display:flex;gap:8px;">
      <button style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#FFFFFF;border:1px solid #E2E8F0;color:#0F172A;border-radius:8px;padding:9px;font-size:12.5px;font-weight:600;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        重新輸入

      <button style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#3B8F76;color:#FFFFFF;border:none;border-radius:8px;padding:9px;font-size:12.5px;font-weight:600;">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
        新增 3 筆
      </button>
    </div>

  </div>

</div>
