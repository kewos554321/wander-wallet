<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
</style>
</helmet>

<div style="width:390px;height:1030px;position:relative;background:#FAF7F2;font-family:'Noto Sans TC',sans-serif;color:#1B1815;overflow:hidden;">

  <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E7DFD2;">
    <a href="Trip.dc.html" aria-label="返回" style="width:34px;height:34px;border-radius:50%;border:1px solid #E7DFD2;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#1B1815;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin:0;flex:1;text-align:center;font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;">里程</h1>
    <span style="width:34px;height:34px;" aria-hidden="true"></span>
  </div>

  <div style="margin:14px 16px 0;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;padding:16px;">
    <p style="margin:0 0 12px;font-size:13px;color:#1B5847;font-weight:700;">路線規劃</p>
    <div style="background:#EAF5F1;border:1px solid #DCEAE3;border-radius:10px;padding:10px 12px;font-size:11px;color:#1B5847;margin-bottom:12px;">
      加入沿途地點，計算總里程並開啟Google Maps導航
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="width:22px;height:22px;border-radius:50%;background:#1B5847;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">A</span>
        <div style="flex:1;background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:9px 12px;font-size:13px;">東京車站</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="width:22px;height:22px;border-radius:50%;background:#1B5847;color:#FFFFFF;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">B</span>
        <div style="flex:1;background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:9px 12px;font-size:13px;">京都嵐山</div>
        <button type="button" aria-label="移除" style="width:24px;height:24px;color:#B7AE9D;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
      </div>
    </div>
    <button type="button" style="margin-top:10px;display:flex;align-items:center;gap:6px;color:#1B5847;font-size:13px;font-weight:600;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>
      新增地點
    </button>
    <button type="button" style="margin-top:14px;width:100%;background:#1B5847;color:#FFFFFF;border-radius:12px;padding:13px;font-size:14px;font-weight:700;">開啟 Google Maps</button>
  </div>

  <div style="margin:14px 16px 0;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;padding:16px;">
    <p style="margin:0 0 12px;font-size:13px;color:#1B5847;font-weight:700;">油費計算</p>
    <div style="background:#EAF5F1;border:1px solid #DCEAE3;border-radius:10px;padding:10px 12px;font-size:11px;color:#1B5847;margin-bottom:12px;line-height:1.6;">
      油費＝總里程 ÷ 油耗 × 油價，再除以分攤人數<br>參考油耗：汽油車約 12-15 km/L
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div>
        <label style="display:block;font-size:11px;color:#6E6860;margin-bottom:4px;">總里程 (km)</label>
        <div style="background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;color:#1B1815;">320</div>
      </div>
      <div>
        <label style="display:block;font-size:11px;color:#6E6860;margin-bottom:4px;">油價 ($/L)</label>
        <div style="background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;color:#1B1815;">32.5</div>
      </div>
      <div>
        <label style="display:block;font-size:11px;color:#6E6860;margin-bottom:4px;">油耗 (km/L)</label>
        <div style="background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;color:#1B1815;">13</div>
      </div>
      <div>
        <label style="display:block;font-size:11px;color:#6E6860;margin-bottom:4px;">分攤人數</label>
        <div style="background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:700;color:#1B1815;">4</div>
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
      <span style="background:#EAF5F1;color:#1B5847;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:600;">目前油價 32.5</span>
      <span style="background:#EAF5F1;color:#1B5847;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:600;">98 無鉛 34.2</span>
    </div>
    <button type="button" style="margin-top:14px;width:100%;background:#1B5847;color:#FFFFFF;border-radius:12px;padding:13px;font-size:14px;font-weight:700;">計算油費</button>
  </div>

  <div style="margin:14px 16px 0;position:relative;border-radius:18px;overflow:hidden;color:#FAF7F2;">
    <div style="position:absolute;inset:0;background:#1B5847;"></div>
    <div style="position:relative;padding:18px 20px;">
      <p style="margin:0 0 10px;font-size:12px;opacity:.75;">320km ÷ 13km/L × $32.5 ÷ 4人</p>
      <p style="margin:0;font-size:13px;font-weight:500;opacity:.85;">總油費</p>
      <p style="margin:2px 0 14px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:22px;">$ 800</p>
      <p style="margin:0;font-size:13px;font-weight:500;opacity:.85;">每人分攤</p>
      <p style="margin:2px 0 0;font-family:'Noto Serif TC',serif;font-weight:700;font-size:32px;line-height:40px;">$ 200</p>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1030}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
