    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">

    </div>

      <div style="background:#FAF7F2;border-radius:10px;padding:9px 12px;">
        <p style="margin:0 0 3px;font-size:13px;font-weight:600;">一蘭拉麵晚餐 · $1,280</p>
        <p style="margin:0;font-size:11px;color:#1B5847;">付款：志明</p>
        <p style="margin:0;font-size:11px;color:#9C7A28;">分攤：$320（1280 ÷ 4）</p>
      </div>
      <div style="background:#FAF7F2;border-radius:10px;padding:9px 12px;">

      <p style="margin:0;font-size:13px;font-weight:700;color:#1B5847;">計算各人總額</p>
    </div>
    <table style="margin:0 0 6px 32px;width:calc(100% - 32px);background:#FAF7F2;border-radius:10px;overflow:hidden;">

      </tr>
      <tr>

        <td style="padding:7px 8px;font-size:12px;color:#1B5847;">$1,280</td>
        <td style="padding:7px 8px;font-size:12px;color:#9C7A28;">$3,820</td>
        <td style="padding:7px 8px;font-size:12px;color:#C0533A;">-$2,540</td>
      </tr>
      <tr>
        <td style="padding:7px 8px;font-size:12px;">小美</td>
        <td style="padding:7px 8px;font-size:12px;color:#1B5847;">$14,000</td>
        <td style="padding:7px 8px;font-size:12px;color:#9C7A28;">$3,820</td>
        <td style="padding:7px 8px;font-size:12px;color:#1B5847;">+$10,180</td>
      </tr>
    </table>
    <p style="margin:0 0 18px 32px;font-size:10px;color:#A79F8F;">餘額 = 已付金額 − 應付金額（正數表示應收回，負數表示需付出）</p>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span style="width:24px;height:24px;border-radius:50%;background:#1B5847;color:#FAF7F2;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">3</span>
      <p style="margin:0;font-size:13px;font-weight:700;color:#1B5847;">結算方案</p>
    </div>
    <div style="margin:0 0 4px 32px;background:#EAF5F1;border-radius:10px;padding:10px 12px;">
      <p style="margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px;">
        <span style="color:#A79F8F;">1.</span>
        <span style="color:#C0533A;">志明</span>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#6E6860" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        <span style="color:#1B5847;">小美</span>
        <span style="margin-left:auto;font-weight:700;color:#1B5847;">$2,540</span>
      </p>
    </div>
    <p style="margin:6px 0 0 32px;font-size:10px;color:#A79F8F;">以上為最少轉帳次數的結算方案，共需 1 筆轉帳</p>

  </div>

</div>
