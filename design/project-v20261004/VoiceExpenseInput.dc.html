<body>
<x-dc>
<helmet>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }

<div style="width:390px;height:900px;position:relative;background:#FAF7F2;font-family:'Noto Sans TC',sans-serif;color:#1B1815;overflow:hidden;">

  <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;">

    </a>
    <h1 style="margin:0;font-family:'Noto Serif TC',serif;font-weight:600;font-size:17px;">AI 快速記帳</h1>
    <span style="width:32px;height:32px;"></span>
  </div>

  <div style="margin:20px 16px 0;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;padding:16px;">
    <p style="margin:0 0 12px;font-size:13px;color:#1B5847;font-weight:700;">說出或輸入消費內容</p>
    <div style="position:relative;border:1px solid #E7DFD2;border-radius:14px;background:#FAF7F2;padding:14px 56px 14px 14px;min-height:80px;box-sizing:border-box;">
      <span style="font-size:13px;color:#B7AE9D;line-height:1.5;">例如：早餐 100 我付、晚餐 600 大家分……</span>
      <button type="button" aria-label="語音輸入" style="position:absolute;right:10px;bottom:10px;width:38px;height:38px;flex-shrink:0;border-radius:50%;background:#1B5847;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(27,88,71,.3);">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0014 0M12 18v3"></path></svg>
      </button>
    </div>
    <p style="margin:6px 0 0;font-size:12px;color:#B7AE9D;">支援一次多筆、不同付款人 · 點麥克風可語音輸入</p>
  </div>

  <div style="margin:12px 16px 0;display:flex;gap:6px;overflow-x:auto;">
    <button style="flex-shrink:0;background:#F1EBE0;color:#6E6860;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;">早餐 100 我付</button>
    <button style="flex-shrink:0;background:#F1EBE0;color:#6E6860;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;">晚餐 600 大家分</button>
    <button style="flex-shrink:0;background:#F1EBE0;color:#6E6860;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600;">計程車 250 小明付</button>
  </div>

  <div style="margin:22px 16px 0;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;padding:16px;">
    <p style="margin:0 0 8px;font-size:13px;color:#1B5847;font-weight:700;">收據/消費圖片</p>
    <div style="display:flex;gap:10px;">
      <button type="button" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;border:1.5px dashed #C9BFAC;border-radius:14px;padding:16px 10px;background:#FAF7F2;color:#6E6860;">
        <span style="width:32px;height:32px;border-radius:50%;background:#FBEAE0;color:#E8825A;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 012-2h1.2a2 2 0 001.6-.8l.9-1.2a2 2 0 011.6-.8h1.4a2 2 0 011.6.8l.9 1.2a2 2 0 001.6.8H18a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"></path><circle cx="12" cy="13" r="3.3"></circle></svg>
        </span>
        <span style="font-size:12px;font-weight:600;">拍照</span>
      </button>
      <button type="button" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;border:1.5px dashed #C9BFAC;border-radius:14px;padding:16px 10px;background:#FAF7F2;color:#6E6860;">
        <span style="width:32px;height:32px;border-radius:50%;background:#EAF5F1;color:#1B5847;display:flex;align-items:center;justify-content:center;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8.5" cy="10" r="1.4"></circle><path d="M21 15l-5-4-4 3-3-2-6 5"></path></svg>
        </span>
        <span style="font-size:12px;font-weight:600;">選擇圖片</span>
      </button>
    </div>
    <p style="margin:8px 0 0;font-size:12px;color:#B7AE9D;">AI 自動辨識金額與品項</p>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px;background:#FFFFFF;border-top:1px solid #E7DFD2;">
    <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:#1B5847;color:#FFFFFF;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:700;">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.5L18 9l-4.1 1.5L12 15l-1.9-4.5L6 9l4.1-1.5z"></path></svg>
      AI 解析
    </button>
  </div>

</div>
</x-dc>
