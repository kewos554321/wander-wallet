<!doctype html>
<html lang="zh-Hant">
<head>

<body>
<x-dc>
<helmet>

<style>

        <button type="button" onClick="{{toggleMore}}" aria-label="更多功能" style="display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;width:52px;">
          <span style="width:46px;height:46px;border-radius:50%;background:#F1EBE0;color:#6E6860;display:flex;align-items:center;justify-content:center;{{moreCircleStyle}}">

          <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;">
            <span style="width:46px;height:46px;border-radius:50%;background:#EAF5F1;color:#1B5847;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V12l2-5h12l2 5v4"></path><path d="M4 16h16M7 16v2M17 16v2"></path><circle cx="7.5" cy="16" r="1.3"></circle><circle cx="16.5" cy="16" r="1.3"></circle></svg>

              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 10-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg>

            <span style="font-size:12px;font-weight:500;line-height:16px;letter-spacing:.5px;">地圖</span>
          </a>
          <a href="#" style="display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;">
            <span style="width:46px;height:46px;border-radius:50%;background:#F6E9EE;color:#A14A68;display:flex;align-items:center;justify-content:center;">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="14" height="14" rx="2"></rect><path d="M3 15V5a2 2 0 012-2h10"></path></svg>

      </sc-if>

    </div>
  </div>

  <div style="padding:16px;">
    <p style="margin:0;font-size:11px;color:#B7AE9D;">提示：點擊「更多」icon可展開/收合下方剩餘功能（互動demo，可直接點擊試試）。</p>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showMore: false };
  }
  renderVals() {
    const showMore = this.state.showMore;
    const toggleMore = () => this.setState({ showMore: !this.state.showMore });
    const moreCircleStyle = showMore ? 'background:#1B5847;color:#FFFFFF;' : '';
    return {
      showMore: showMore,
      toggleMore: toggleMore,
      moreCircleStyle: moreCircleStyle,
    };
  }
}
</script>
</body>
</html>
