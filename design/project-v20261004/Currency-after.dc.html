<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
  summary { list-style: none; }
  summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
</style>
</helmet>

<div style="width:390px;height:910px;position:relative;background:#FAF7F2;font-family:'Noto Sans TC',sans-serif;color:#1B1815;overflow:hidden;">

  <div style="padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E7DFD2;">
    <a href="Trip.dc.html" aria-label="返回" style="width:34px;height:34px;border-radius:50%;border:1px solid #E7DFD2;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#1B1815;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin:0;flex:1;text-align:center;font-family:'Noto Serif TC',serif;font-weight:700;font-size:16px;line-height:24px;letter-spacing:.15px;">匯率</h1>
    <span style="width:34px;height:34px;" aria-hidden="true"></span>
  </div>

  <div style="margin:14px 16px 0;position:relative;border-radius:20px;overflow:hidden;color:#FAF7F2;">
    <div style="position:absolute;inset:0;background:#1B5847;"></div>
    <div style="position:relative;padding:18px 20px;">
      <p style="margin:0 0 12px;font-size:13px;font-weight:600;opacity:.85;">匯率換算</p>
      <p style="margin:0 0 4px;font-size:11px;opacity:.7;">金額</p>
      <div style="background:rgba(250,247,242,.12);border:1px solid rgba(250,247,242,.3);border-radius:12px;padding:12px 14px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:20px;margin-bottom:14px;">1,000</div>
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;">
        <div style="background:rgba(250,247,242,.12);border:1px solid rgba(250,247,242,.3);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;">
          <span>JPY</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" opacity=".7"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
        <button type="button" aria-label="交換幣別" style="width:30px;height:30px;border-radius:50%;background:#FAF7F2;color:#1B5847;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5-5 5 5M7 14l5 5 5-5"></path></svg>
        </button>
        <div style="background:rgba(250,247,242,.12);border:1px solid rgba(250,247,242,.3);border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;">
          <span>TWD</span>
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" opacity=".7"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
      </div>
      <p style="margin:14px 0 0;font-family:'Noto Serif TC',serif;font-weight:700;font-size:32px;line-height:40px;">NT$ 210</p>
      <div style="margin-top:6px;display:flex;align-items:center;gap:5px;font-size:11px;opacity:.75;">
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>
        <span>更新於 2 小時前 · 1 JPY = 0.21 TWD</span>
      </div>
    </div>
  </div>

  <div style="margin:14px 16px 0;background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;padding:16px;">
    <p style="margin:0 0 10px;font-size:13px;color:#1B5847;font-weight:700;">專案自訂匯率</p>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0EAE0;">
      <span style="font-size:13px;font-weight:600;">JPY → TWD</span>
      <div style="text-align:right;">
        <p style="margin:0;font-size:13px;font-weight:700;color:#1B1815;">0.21（自訂）</p>
        <p style="margin:0;font-size:11px;color:#24735D;">即時0.214 · +1.9%</p>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 0;">
      <span style="font-size:13px;font-weight:600;">USD → TWD</span>
      <div style="text-align:right;">
        <p style="margin:0;font-size:13px;font-weight:700;color:#1B1815;">31.5（自訂）</p>
        <p style="margin:0;font-size:11px;color:#C4432A;">即時31.2 · -1.0%</p>
      </div>
    </div>
  </div>

  <div style="margin:14px 16px 0;">
    <details open style="background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;overflow:hidden;">
      <summary style="cursor:pointer;padding:16px;display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#1B5847" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M3 17l6-6 4 4 7-8"></path><path d="M15 7h6v6"></path></svg>
        <span style="font-size:13px;color:#1B5847;font-weight:700;flex:1;">即時匯率</span>
        <svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#B7AE9D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .15s;flex-shrink:0;"><path d="M6 9l6 6 6-6"></path></svg>
      </summary>
      <div style="padding:0 16px 16px;">
        <div style="background:#FDF1EC;border:1px solid #F3D3C4;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:6px;margin-bottom:10px;">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#C4432A" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
          <span style="font-size:11px;color:#C4432A;">部分匯率已超過24小時未更新</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
          <div style="background:#EAF5F1;border-radius:10px;padding:10px;text-align:center;">
            <p style="margin:0;font-size:11px;color:#6E6860;">JPY</p>
            <p style="margin:2px 0 0;font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:#1B1815;">0.214</p>
          </div>
          <div style="background:#EAF5F1;border-radius:10px;padding:10px;text-align:center;">
            <p style="margin:0;font-size:11px;color:#6E6860;">USD</p>
            <p style="margin:2px 0 0;font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:#1B1815;">31.2</p>
          </div>
          <div style="background:#EAF5F1;border-radius:10px;padding:10px;text-align:center;">
            <p style="margin:0;font-size:11px;color:#6E6860;">EUR</p>
            <p style="margin:2px 0 0;font-family:'Noto Serif TC',serif;font-size:14px;font-weight:700;color:#1B1815;">33.8</p>
          </div>
        </div>
      </div>
    </details>
  </div>

  <div style="margin:14px 16px 0;">
    <details style="background:#FFFFFF;border:1px solid #E7DFD2;border-radius:16px;overflow:hidden;">
      <summary style="cursor:pointer;padding:16px;display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#1B5847" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <span style="font-size:13px;color:#1B5847;font-weight:700;flex:1;">歷史匯率查詢</span>
        <svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#B7AE9D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transition:transform .15s;flex-shrink:0;"><path d="M6 9l6 6 6-6"></path></svg>
      </summary>
      <div style="padding:0 16px 16px;display:flex;gap:8px;">
        <div style="flex:1;background:#FAF7F2;border:1px solid #E7DFD2;border-radius:10px;padding:10px 12px;font-size:13px;color:#6E6860;">2026/09/15</div>
        <button type="button" style="background:#1B5847;color:#FFFFFF;border-radius:10px;padding:0 18px;font-size:13px;font-weight:700;">查詢</button>
      </div>
    </details>
  </div>

</div>
</x-dc>
