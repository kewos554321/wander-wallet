<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&amp;family=Noto+Sans+TC:wght@400;500;600;700&amp;display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; }
</style>
</helmet>

<div style="width:390px;height:580px;position:relative;background:rgba(27,24,21,.5);font-family:'Noto Sans TC',sans-serif;color:#1B1815;overflow:hidden;display:flex;align-items:center;justify-content:center;">

  <div style="width:340px;background:#FFFFFF;border-radius:20px;padding:22px;">

    <h2 style="margin:0 0 6px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:17px;">加入「京都賞楓行」</h2>
    <p style="margin:0 0 16px;font-size:13px;color:#6E6860;">選擇加入方式</p>

    <p style="margin:0 0 4px;font-size:13px;font-weight:700;color:#1B5847;">認領現有成員</p>
    <p style="margin:0 0 10px;font-size:11px;color:#A79F8F;">如果專案創建者已經幫你新增了佔位成員，請選擇你的名字</p>

    <div style="display:flex;flex-direction:column;gap:8px;max-height:120px;overflow-y:auto;margin-bottom:14px;">
      <label style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1.5px solid #1B5847;background:#EAF5F1;">
        <input type="radio" checked style="margin:0;accent-color:#1B5847;">
        <span style="font-size:14px;font-weight:600;">小美</span>
      </label>
      <label style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;border:1.5px solid #E7DFD2;">
        <input type="radio" style="margin:0;">
        <span style="font-size:14px;">志明</span>
      </label>
    </div>

    <button type="button" style="width:100%;height:44px;border-radius:12px;background:#1B5847;color:#FAF7F2;font-size:14px;font-weight:700;margin-bottom:18px;">確認認領</button>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px;">
      <span style="flex:1;height:1px;background:#E7DFD2;"></span>
      <span style="font-size:11px;color:#A79F8F;">或</span>
      <span style="flex:1;height:1px;background:#E7DFD2;"></span>
    </div>

    <p style="margin:0 0 4px;font-size:13px;font-weight:700;color:#1B5847;">建立新成員</p>
    <p style="margin:0 0 10px;font-size:11px;color:#A79F8F;">以新成員身份加入，可查看支出記錄、新增支出並參與分帳</p>
    <button type="button" style="width:100%;height:44px;border-radius:12px;border:1px solid #B7D9CB;background:#EAF5F1;color:#1B5847;font-size:14px;font-weight:700;margin-bottom:16px;">以新成員加入</button>

    <button type="button" style="width:100%;height:40px;border-radius:12px;border:1px solid #E7DFD2;background:#FFFFFF;color:#6E6860;font-size:13px;font-weight:600;">取消</button>

  </div>

</div>
</x-dc>

</body>
</html>
